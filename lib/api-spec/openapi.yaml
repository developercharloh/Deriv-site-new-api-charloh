openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/bot-builder/generate:
    post:
      operationId: generateOpenaiBotStrategy
      tags: [openai]
      summary: Generate a Blockly strategy from a natural-language prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiBotStrategyInput"
      responses:
        "200":
          description: Generated strategy for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiBotStrategy"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "429":
          description: Generation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "422":
          description: Generated strategy did not satisfy the requested contract or conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "502":
          description: OpenAI could not generate a valid strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "503":
          description: OpenAI integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiBotStrategyInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 12
          maxLength: 1400
        existingXml:
          type: string
          maxLength: 60000
          description: Existing generated strategy XML to refine with the new prompt
        blockCatalog:
          type: string
          minLength: 1
          maxLength: 75000
          description: Verified Blockly block templates from the active Bot Builder toolbox
      required:
        - prompt
        - blockCatalog
    OpenaiBotStrategy:
      type: object
      properties:
        title:
          type: string
          maxLength: 80
        summary:
          type: string
          maxLength: 800
        xml:
          type: string
          maxLength: 60000
        blockCount:
          type: number
          minimum: 1
          maximum: 250
          multipleOf: 1
        warnings:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            maxLength: 200
      required:
        - title
        - summary
        - xml
        - blockCount
        - warnings
    OpenaiError:
      type: object
      properties:
        error:
          type: string
          maxLength: 300
      required:
        - error

